<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Nexstay CRM</title>
<meta name="description" content="Nexstay CRM — gestion de conciergerie locative">
<meta name="theme-color" content="#C27A6B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/crm.css">
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="brand brand-lg"><span>Nex</span><b>stay</b><small>CRM</small></div>
    <p class="muted">Connectez-vous pour accéder à votre espace de gestion.</p>
    <label>Identifiant<input name="login" autocomplete="username" required autofocus></label>
    <label>Mot de passe<input name="password" type="password" data-reveal autocomplete="current-password" required></label>
    <p id="login-error" class="error" hidden></p>
    <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
  </form>
</div>

<!-- APPLICATION -->
<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span>Nex</span><b>stay</b><small>CRM</small></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <button id="search-btn" class="nav-item" type="button" title="Recherche (Ctrl+K)">
        <svg><use href="#i-search"/></svg><span>Rechercher</span><kbd>Ctrl K</kbd>
      </button>
      <button id="theme-btn" class="nav-item" type="button"><svg><use href="#i-moon"/></svg><span>Thème sombre</span></button>
      <button id="logout-btn" class="nav-item" type="button"><svg><use href="#i-logout"/></svg><span>Déconnexion</span></button>
      <div id="whoami" class="whoami"></div>
    </div>
    <button id="collapse-btn" class="collapse-btn" type="button" title="Réduire / agrandir le menu" aria-label="Réduire le menu">
      <svg><use href="#i-chevron-left"/></svg>
    </button>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn mobile-only" type="button" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
      <h1 id="page-title">Tableau de bord</h1>
      <div id="page-actions" class="page-actions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="print-area" class="print-area" aria-hidden="true"></div>

<!-- ICÔNES SVG MONOCHROMES -->

    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></symbol>

  </defs>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

</body>
</html>
